name: Sync upstream companies

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1"

permissions:
  contents: write

concurrency:
  group: sync-upstream-companies
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Hiring Without Whiteboards data
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync companies from upstream README
        run: npm run companies:sync

      - name: Validate generated site
        run: |
          npm run test
          npm run build

      - name: Commit synced data
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "Sync companies from upstream dataset"
          file_pattern: src/data/companies.json
